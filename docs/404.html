<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eksik Var — Maça katıl</title>
<meta name="description" content="Eksik Var'da bir maça davet edildin. Tarih, saha, ücret ve kaç kişi eksik olduğunu gör; uygulamada aç ve kadroya katıl.">
<meta property="og:title" content="Bir maça davet edildin ⚽ · Eksik Var">
<meta property="og:description" content="Kadroda yer var. Uygulamada aç, tek dokunuşla katıl.">
<meta property="og:site_name" content="Eksik Var">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ev.css">
<style>body{background:var(--saha);display:flex;flex-direction:column;min-height:100vh}.orta{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}</style>
</head>
<body>
<header class="ust"><div class="ust-ic"><a class="marka" href="/">EKSİK <em>VAR</em></a><a class="indir" href="/#indir">Uygulamayı indir</a></div></header>
<div class="orta">
  <div class="kart" id="kart">
    <div id="yok" style="display:none">
      <h1>Sayfa bulunamadı</h1>
      <p>Aradığın sayfa taşınmış ya da hiç olmamış olabilir. Şehrinin sayfasından açık maçlara bakabilirsin.</p>
      <div class="ilce-liste" style="margin-top:14px"><a href="/ankara">Ankara</a><a href="/istanbul">İstanbul</a><a href="/izmir">İzmir</a><a href="/bursa">Bursa</a></div>
      <a class="btn b1" href="/">Ana sayfaya dön</a>
    </div>
    <div id="mac" style="display:none"><div class="yuk">Maç yükleniyor…</div></div>
  </div>
</div>
<script src="/ev.js"></script>
<script>
  (function(){
    var m = location.pathname.match(/\/e\/([A-Za-z0-9-]+)/);
    var q = location.search || "";
    if (!m) { document.getElementById("yok").style.display = "block"; return; }
    var id = m[1], derin = "eksikvar://e/" + id + q;
    var kutu = document.getElementById("mac"); kutu.style.display = "block";
    EV.event(id, kutu);
    // Telefonda otomatik dene: uygulama yüklüyse açılır, değilse sayfada kalır
    var ua = navigator.userAgent || "";
    if (/android|iphone|ipad|ipod/i.test(ua) && !/[?&]kal=1/.test(q)) setTimeout(function(){ location.href = derin; }, 900);
  })();
</script>
</body>
</html>
